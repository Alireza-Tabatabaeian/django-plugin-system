[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-plugin-system"
version = "2.0.8"
description = "A flexible plugin framework for Django with admin-managed plugin instances and registry-to-database sync."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICEN[CS]E*"]
authors = [
  { name = "Alireza Tabatabaeian", email = "alireza.tabatabaeian@gmail.com" }
]
keywords = ["django", "plugins", "registry", "extensibility", "admin", "plugin-system"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Internet :: WWW/HTTP"
]

dependencies = [
  "Django>=4.2,<6.1",
  "django-fernet-encrypted-fields>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/Alireza-Tabatabaeian/django-plugin-system"
Issues = "https://github.com/Alireza-Tabatabaeian/django-plugin-system/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_plugin_system", "django_plugin_system.*"]

[tool.setuptools.package-data]
django_plugin_system = [
  "py.typed",
  "templates/**/*.html",
  "migrations/*.py",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests/test_*.py"]
pythonpath = [".", "src"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.8.0",
  "mypy>=1.8",
  "django-stubs>=5.0.0",
  "black>=24.0.0",
  "ruff>=0.5.0",
  "build>=1.2.0",
  "twine>=5.0.0",
]